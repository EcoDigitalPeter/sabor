spring:
  application:
    name: ottimizo
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/ottimizo}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SUPABASE_JWT_ISSUER:http://localhost}
          jwk-set-uri: ${SUPABASE_JWKS_URI:http://localhost/.well-known/jwks.json}
          jws-algorithms: ES256
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  ai:
    openai:
      # Endpoint oficial da OpenAI por omissao. OPENAI_BASE_URL so' e' preciso
      # se um dia se voltar a apontar para um endpoint compativel alternativo
      # (ja' foi usado NVIDIA NIM nesta app — descontinuado por latencia
      # inaceitavel: ~170s por geracao de plano mensal, contra o SLA
      # implicito de poucas dezenas de segundos que o MAX_ATTEMPTS=3 sem
      # backoff do AiMealPlanService assume).
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: ${OPENAI_CHAT_MODEL:gpt-4.1-mini}
          temperature: 0.2
      image:
        options:
          model: ${OPENAI_IMAGE_MODEL:gpt-image-1-mini}

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

ottimizo:
  cors:
    allowed-origins: ${APP_CORS_ORIGINS:http://localhost:3000}
  ai:
    meal-plan-daily-limit: ${MEAL_PLAN_DAILY_LIMIT:10}
  supabase:
    storage-url: ${SUPABASE_STORAGE_URL:http://localhost/storage/v1}
    service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:}
