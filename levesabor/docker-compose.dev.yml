# BE-A03 · Infra local de desenvolvimento — ver docs/plano/03-backend-plan.md §10
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ottimizo
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
    ports:
      - "5432:5432"
    volumes:
      - ottimizo_pgdata:/var/lib/postgresql/data

volumes:
  ottimizo_pgdata:
