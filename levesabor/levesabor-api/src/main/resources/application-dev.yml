# BE-A03 · Perfil dev — Postgres do docker-compose.dev.yml; valores NÃO sensíveis
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/levesabor
    username: dev
    password: dev
  flyway:
    placeholders:
      seed_admin_bcrypt: "$2a$10$DEV.ONLY.PLACEHOLDER.HASH.substituir.no.arranque"

security:
  jwt:
    secret-key: ZGV2LW9ubHktc2VjcmV0LWtleS1jb20tMzItYnl0ZXMhIQ==   # dev only

app:
