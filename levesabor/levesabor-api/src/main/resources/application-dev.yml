  ai:
    api-key: ${OPENAI_API_KEY:}   # em dev usar WireMock nos testes; chave real opcional
    daily-limit: 50

springdoc:
  swagger-ui:
    enabled: true

logging:
  level:
    mz.levesabor: DEBUG
